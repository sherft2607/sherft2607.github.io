<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="portfolio-style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Product+Sans&display=swap">
</head>
<body>
    <!-- Navbar -->
    <header>
        <nav>
            <div class="name">
                <a href="index.html" style="text-decoration: none; color: inherit; padding: 0; background-color: transparent; transition: none; font-size: inherit;">Shandon Herft</a>
            </div>
            <button class="menu-button" onclick="toggleMenu()">Menu</button>
            <ul>
                <li><a href="index.html">ABOUT</a></li>
                <li><a href="resume.html">RESUME</a></li>
                <li><a href="portfolio.html">PORTFOLIO</a></li>
            </ul>
        </nav>
    </header>

    <!-- Portfolio Page Content -->
    <main class="portfolio">
        <section class="portfolio-introduction">
            <div class="portfolio-container">
                <!-- Text Content on the Right -->
                <div class="text-content">
                    <h1>PORTFOLIO</h1>
                    <p>Explore my work and experience through the following projects. Click the link below to view my full PDF portfolio.</p>
                    <a href="https://drive.google.com/file/d/1JSO5NSLD3_1wF3Knoppm0EsjwC1opkP6/view" style="font-size: 1.2em;" target="_blank" class="portfolio-link">View My Portfolio (PDF)</a>
                </div>                
            </div>
            <!-- Embedding the Portfolio PDF Preview -->
            <div class="portfolio-preview">
                <iframe src="https://drive.google.com/file/d/1JSO5NSLD3_1wF3Knoppm0EsjwC1opkP6/preview" width="100%" height="700"></iframe>
            </div>
        </section>
    </main>

    <!-- JavaScript for Navbar -->
    <script>
        // JavaScript for Navbar
        function toggleMenu() {
            const menu = document.querySelector('nav ul');
            const button = document.querySelector('.menu-button');
            menu.classList.toggle('active');
            const expanded = menu.classList.contains('active');
            button.setAttribute('aria-expanded', expanded);
        }

        // Close menu when clicking anywhere inside the ul
        document.querySelector('nav ul').addEventListener('click', (event) => {
            const menu = document.querySelector('nav ul');
            menu.classList.remove('active');
            const button = document.querySelector('.menu-button');
            button.setAttribute('aria-expanded', false);
        });
    </script>
</body>
</html>
